# =====================================================================
# Cuidarte+ · Configuracion de SonarQube
# Caso CP-SAST-01 · NFR-CAL-3, NFR-SEG-5
#
# Ejecucion (ver docs/04_Paso_a_Paso_Reproducir_EV2.md):
#   docker run -d --name sonarqube -p 9000:9000 sonarqube:lts-community
#   npx sonarqube-scanner -Dsonar.token=$SONAR_TOKEN
#
# El token NUNCA va en este archivo: se entrega por variable de entorno o como
# secret de CI (NFR-SEG-13).
# =====================================================================

sonar.projectKey=cuidarte-plus
sonar.projectName=Cuidarte+ (Caso B)
sonar.projectVersion=1.1.0

# --- Alcance del analisis ---------------------------------------------
sonar.sources=api/src,web/src
sonar.tests=api/tests
sonar.sourceEncoding=UTF-8

# Se excluye lo generado y lo que no es codigo propio: incluirlo distorsiona
# las metricas de duplicacion y de deuda tecnica.
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/reportes/**,**/*.jmx

# --- Cobertura (NFR-CAL-1) --------------------------------------------
# Sonar no ejecuta las pruebas: consume el informe LCOV que genera Jest.
sonar.javascript.lcov.reportPaths=api/coverage/lcov.info

# Los archivos de prueba se analizan como tests, no como codigo de produccion.
sonar.test.inclusions=api/tests/**/*.js

# --- Puerta de calidad -------------------------------------------------
# El Quality Gate se configura en el servidor; aqui se declara la intencion
# para que quede versionada junto al codigo:
#   * 0 bugs y 0 vulnerabilidades de severidad Blocker/Critical
#   * 0 security hotspots sin revisar
#   * cobertura de lineas >= 80 % en el codigo nuevo
#   * duplicacion <= 3 %
sonar.qualitygate.wait=true
