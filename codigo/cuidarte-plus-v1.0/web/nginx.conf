# =====================================================================
# Cuidarte+ · configuracion de nginx para la SPA
# =====================================================================

server {
    listen 5173;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # No revelar la version del servidor (OWASP A05).
    server_tokens off;

    # Cabeceras de seguridad tambien para los archivos estaticos: el escaneo
    # pasivo de OWASP ZAP las verifica en TODA respuesta, no solo en la API
    # (NFR-SEG-10).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    # HSTS: en QA la aplicacion se sirve por HTTP, pero la cabecera se declara
    # para que la configuracion sea la misma que en produccion (NFR-SEG-1).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # La API se expone por el mismo origen: asi la SPA no necesita CORS
    # permisivo y la politica del backend se prueba de forma realista.
    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 12m;
    }

    # Enrutado de SPA: cualquier ruta desconocida devuelve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los assets con hash en el nombre se pueden cachear agresivamente.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
